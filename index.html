<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Xross Forge</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2304050c'/%3E%3Cpath d='M6 6l20 20' stroke='%2318e4ff' stroke-width='4'/%3E%3Cpath d='M26 6L6 26' stroke='%23ff2bd1' stroke-width='4'/%3E%3C/svg%3E">
<meta name="theme-color" content="#04050c">
<link rel="stylesheet" href="styles.css?v=6b56ae3789">
</head>
<body>
<!-- Arena backdrop: pure CSS, no images. -->
<div class="arena" aria-hidden="true"><div class="floor"></div><div class="vignette"></div></div>

<div id="app">
  <div class="ticker"><span class="rec">Fan build</span><span>evilgouki</span></div>

  <main class="title" id="title-screen">
    <h1 class="wordmark"><span class="wm-xross">XROSS</span> <span class="wm-forge">FORGE</span></h1>
    <p class="subtitle">Unofficial, non-commercial fan project. Play a starter-deck match against a bot.</p>

    <section class="setup" aria-label="Match setup">
      <fieldset class="opt-group" id="opt-mode">
        <legend>Mode</legend>
        <label class="opt"><input type="radio" name="mode" value="full" checked><span class="opt-body"><b>Full match</b><i>Best of 3 rounds</i></span></label>
        <label class="opt"><input type="radio" name="mode" value="quick"><span class="opt-body"><b>Quick match</b><i>One round</i></span></label>
      </fieldset>
      <fieldset class="opt-group" id="opt-tier">
        <legend>Opponent <span class="legend-sub">(level)</span></legend>
        <label class="opt" title="Plays one card at a time and sometimes misjudges."><input type="radio" name="tier" value="easy"><span class="opt-body"><b>Easy</b></span></label>
        <label class="opt" title="Plans its whole turn before it plays a card."><input type="radio" name="tier" value="normal" checked><span class="opt-body"><b>Normal</b></span></label>
        <label class="opt" title="Plans its turn, then plays out your reply to check it is safe."><input type="radio" name="tier" value="hard"><span class="opt-body"><b>Hard</b></span></label>
      </fieldset>
      <fieldset class="opt-group" id="opt-deck">
        <legend>Your deck <span class="legend-sub">(the bot plays the other one)</span></legend>
        <label class="opt"><input type="radio" name="deck" value="ST01" checked><span class="opt-body"><b>ST01 First Glory</b><i>初の栄冠 · VSPO!</i></span></label>
        <label class="opt"><input type="radio" name="deck" value="ST02"><span class="opt-body"><b>ST02 Advent of the Demon King</b><i>魔王降臨 · Crazy Raccoon</i></span></label>
        <label class="opt"><input type="radio" name="deck" value="random"><span class="opt-body"><b>Surprise me</b><i>The game picks one</i></span></label>
      </fieldset>
    </section>

    <div class="play-wrap">
      <button id="play" class="play" type="button">Play</button>
      <p id="play-why" class="why" role="note" hidden></p>
      <p id="ai-status" class="ai-status" role="status" hidden></p>
      <button id="howto-open" class="btn ghost" type="button">How to play</button>
    </div>
    <p class="notice-line" id="notice-line"><span id="notice-text"></span> <button class="linkish" id="notice-open" type="button">Read the full notice</button></p>
  </main>

  <div id="game" hidden>
    <header id="topbar">
      <div class="tb-left"><span class="tb-kicker">XROSS FORGE</span></div>
      <div id="scorebug" aria-label="Scoreboard"></div>
      <div class="tb-right">
        <button class="btn tiny" id="btn-log" type="button">Log</button>
        <button class="btn tiny" id="btn-flag" type="button">Flag a bug</button>
        <button class="btn tiny" id="btn-speed" type="button">Speed: full</button>
        <button class="btn tiny" id="btn-exit" type="button">Menu</button>
      </div>
    </header>
    <main id="board">
      <section class="side side-1" id="side-1" data-seat="1" aria-label="Opponent"></section>
      <div id="mid">
        <div id="turnchip"></div>
        <div id="hint" role="status" aria-live="polite"></div>
        <div id="confirm-slot"></div>
        <div class="et-wrap">
          <span id="endturn-label" hidden></span>
          <button id="endturn" class="endturn" type="button" disabled><span class="et-main">END<br>TURN</span><span class="et-num"></span></button>
        </div>
      </div>
      <section class="side side-0" id="side-0" data-seat="0" aria-label="You"></section>
      <div id="prompt"></div>
      <button id="prompt-pill" class="pill" type="button" hidden></button>
    </main>
    <div id="hand" aria-label="Your hand"></div>
    <footer id="lower" aria-live="off">
      <span class="lt-tag" id="cap-tag">R1</span>
      <span class="lt-main" id="caption"></span>
    </footer>
    <aside id="drawer" aria-label="Game log">
      <div class="dr-head"><b>Game log</b><button class="btn tiny" id="log-close" type="button">Close</button></div>
      <ol id="log-list"></ol>
    </aside>
  </div>

  <footer class="lower-third" id="title-lower">
    <span class="lt-tag">M3</span>
    <span class="lt-main">First playable</span>
    <span class="lt-sub" id="lt-status">vs a random bot</span>
  </footer>
</div>

<!-- Overlays: decorative layers are pointer-events:none; the prompt, viewer and end screen are real dialogs. -->
<div id="fx-layer" aria-hidden="true"></div>
<div id="spot" aria-hidden="true"></div>
<div id="ribbon" aria-hidden="true"></div>
<div id="banner" aria-hidden="true"></div>
<div id="stinger" aria-hidden="true"></div>
<div id="notice" aria-hidden="true"></div>
<div id="fx-lock" aria-hidden="true"></div>
<button id="end-pill" class="pill" type="button" hidden>Show the result</button>
<div id="viewer" class="modal" role="dialog" aria-modal="true" aria-labelledby="viewer-title">
  <div class="modal-card"><div class="modal-head"><h2 id="viewer-title"></h2><button class="btn tiny" id="viewer-close" type="button">Close</button></div><div id="viewer-body"></div></div>
</div>
<div id="confirm-exit" class="modal" role="dialog" aria-modal="true" aria-labelledby="exit-title">
  <div class="modal-card small"><h2 id="exit-title">Leave the match?</h2>
    <div class="modal-actions">
      <button class="btn primary" id="exit-keep" type="button">Keep playing</button>
      <button class="btn" id="exit-concede" type="button">Concede the match</button>
      <button class="btn ghost" id="exit-quit" type="button">Quit to title</button>
    </div>
  </div>
</div>
<div id="endscreen" class="modal" role="dialog" aria-modal="true" aria-labelledby="end-title-h">
  <div class="modal-card end"><div id="end-body"></div>
    <div class="modal-actions">
      <button class="btn primary" id="end-rematch" type="button">Rematch</button>
      <button class="btn" id="end-title" type="button">Back to title</button>
      <button class="btn" id="end-bug" type="button">Save bug report</button>
      <button class="btn ghost" id="end-look" type="button">Look at the board</button>
    </div>
  </div>
</div>
<div id="howto" class="modal" role="dialog" aria-modal="true" aria-labelledby="howto-title">
  <div class="modal-card howto"><div class="modal-head"><h2 id="howto-title">How to play</h2><button class="btn tiny" id="howto-close" type="button">Close</button></div><div id="howto-body"></div></div>
</div>
<div id="notice-full" class="modal" role="dialog" aria-modal="true" aria-labelledby="notice-title">
  <div class="modal-card howto"><div class="modal-head"><h2 id="notice-title">Notice</h2><button class="btn tiny" id="notice-close" type="button">Close</button></div><div id="notice-body"></div></div>
</div>
<div id="zoom" aria-hidden="true"></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="ai-error" role="alert" hidden></div>

<!-- engine -->
<script src="js/ns.js?v=d16e124dae"></script>
<script src="js/rng.js?v=dc20b6eb4a"></script>
<script src="data/defects.js?v=e51ead7472"></script>
<script src="data/tags.js?v=d05e18e233"></script>
<script src="data/cards.js?v=c961b48a5c"></script>
<script src="data/decks.js?v=a23cbc6da5"></script>
<script src="data/abilities.js?v=bafac27c28"></script>
<script src="data/art-manifest.js?v=3f9445dbcb"></script>
<script src="data/sound-manifest.js?v=1f6724961e"></script>
<script src="js/engine/state.js?v=a1a0e7429e"></script>
<script src="js/engine/log.js?v=d7d546723a"></script>
<script src="js/engine/doors.js?v=38d30dbdf5"></script>
<script src="js/engine/abilities.js?v=b3fb7a03d6"></script>
<script src="js/engine/attack.js?v=320a253b66"></script>
<script src="js/engine/flow.js?v=5af106082c"></script>
<script src="js/engine/api.js?v=45ab9532d9"></script>
<!-- /engine -->

<!-- ai -->
<script src="js/ai/determinize.js?v=0a4954de31"></script>
<script src="js/ai/eval.js?v=9abe927716"></script>
<script src="js/ai/policies.js?v=ed7f5483be"></script>
<script src="js/ai/ai.js?v=3cd8e16f76"></script>
<!-- /ai -->
<!-- UI, in dependency order. Everything under js/ui/ is view layer. -->
<script src="js/ui/core.js?v=8216344311"></script>
<script src="js/ui/logtext.js?v=fec05a0333"></script>
<script src="js/ui/cardview.js?v=4440784c17"></script>
<script src="js/ui/preview.js?v=08d72548bc"></script>
<script src="js/ui/anim.js?v=7541b11a96"></script>
<script src="js/ui/targeting.js?v=7e25fce66c"></script>
<script src="js/ui/prompt.js?v=9fded582d8"></script>
<script src="js/ui/board.js?v=3e4b2495ef"></script>
<script src="js/ui/bot-random.js?v=75e84f3887"></script>
<script src="js/ui/bot-ai.js?v=fb0c3a1577"></script>
<script src="js/ui/game.js?v=bc16ce96f9"></script>

<script src="js/ui/boot.js?v=0fb5c858c3"></script>
</body>
</html>
