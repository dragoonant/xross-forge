# Deploy to GitHub Pages on every push to main: gate first, then publish a staged copy of the
# repository root. The site is static; there is no build step.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # No submodules: a private submodule is mounted at docs/knowledge-base and must never be
      # fetched here, let alone published.
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Gate
        run: node tools/gate.mjs
      # Stage only what the site serves (tests/ ships so tests.html runs in the browser).
      # docs/, tools/ and .github/ never ship.
      - name: Stage _site
        run: |
          mkdir _site
          for p in index.html tests.html tests styles.css js data art audio sounds.html manifest.webmanifest; do
            if [ -e "$p" ]; then cp -R --parents "$p" _site/; fi
          done
          touch _site/.nojekyll
          find _site -type f | sort
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
