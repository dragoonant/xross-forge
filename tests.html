<script>
  (function () {
    const esc = (t) => t.replace(/&/g, '&amp;').replace(/</g, '&lt;');
    const r = XS.T.runAll(new URLSearchParams(location.search).get('filter'));
    document.getElementById('out').innerHTML = r.fails.map((f) => '<span class="f">' + esc(f) + '</span>').join('\n') +
      '\n<span class="p">' + r.pass + ' passed</span>, ' + r.fail + ' failed';
  })();
</script>
